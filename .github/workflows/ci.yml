name: CI
on: [push, pull_request]

# CI pins Node 20.12 (the package's engines floor). Do NOT bump to 24+ just to run
# the opencode.db reader test: that reader uses node:sqlite (Node >=22.5) and is
# an opt-in feature (OPENCODE_DB_READER, default on locally but unexercised by
# CI). On Node 20.12 node:sqlite is absent, so opencode-db-reader.test.ts cleanly
# skips. A Node-24 CI run made the server suite hang for >1h in this environment;
# the reader is verified locally on Node 24 instead. See topics/opencode-backend.md.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm capabilities:audit
      - run: pnpm console:scan

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
      # Advisories triaged as unreachable are listed in pnpm.auditConfig.ignoreGhsas
      # (package.json) with rationale in CLAUDE.md "Known-unreachable advisories".
      # A failure here means a new, untriaged advisory: fix it or triage it in both
      # places — never ignore without a table entry.
      - run: pnpm audit --prod

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @yep-anywhere/shared build
      - run: pnpm -F @yep-anywhere/client exec playwright install chromium
      - run: pnpm test

  markdown-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @yep-anywhere/server benchmark:markdown

  windows-host-awake-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @yep-anywhere/shared build
      # A hosted runner can rarely spend the full production startup bound in
      # cold PowerShell/Add-Type setup. One isolated-test retry distinguishes
      # that host jitter without extending YA's bounded 20-second probe.
      - run: >-
          pnpm --filter @yep-anywhere/server exec vitest run
          test/services/WindowsHostAwakeBackend.test.ts --retry=1

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm -F @yep-anywhere/client exec playwright install chromium
      - run: pnpm test:e2e

name: CI
on: [push, pull_request]

# CI pins Node 20.12 (the package's engines floor). Do NOT bump to 24+ just to run
# the opencode.db reader test: that reader uses node:sqlite (Node >=22.5) and is
# an opt-in feature (OPENCODE_DB_READER, default on locally but unexercised by
# CI). On Node 20.12 node:sqlite is absent, so opencode-db-reader.test.ts cleanly
# skips. A Node-24 CI run made the server suite hang for >1h in this environment;
# the reader is verified locally on Node 24 instead. See topics/opencode-backend.md.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm capabilities:audit
      - run: pnpm console:scan

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
      # Advisories triaged as unreachable are listed in auditConfig.ignoreGhsas
      # (pnpm-workspace.yaml) with rationale in CLAUDE.md "Known-unreachable
      # advisories".
      # A failure here means a new, untriaged advisory: fix it or triage it in both
      # places — never ignore without a table entry.
      - run: pnpm audit --prod

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @yep-anywhere/shared build
      - run: pnpm -F @yep-anywhere/client exec playwright install chromium
      - run: pnpm test

  cached-sidebar-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: graehl/agents
          ref: 496159563aafd1f5abd15e4315bf502187d2e9d1
          path: .perf-tools/agents
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm -F @yep-anywhere/client exec playwright install chromium
      - name: Run retained sidebar switch ratchet
        env:
          YA_PERF_SWEEP: ${{ github.workspace }}/.perf-tools/agents/scripts/perf-sweep
        run: >-
          node scripts/perf-suite/run.mjs
          --checkout "$GITHUB_WORKSPACE"
          --driver browser
          --scenario cached-sidebar-switch-routine
          --label "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output cached-sidebar-performance.json
      - name: Upload retained sidebar switch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cached-sidebar-performance-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: cached-sidebar-performance.json
      - name: Verify no performance process debris remains
        if: always()
        env:
          YA_PERF_SWEEP: ${{ github.workspace }}/.perf-tools/agents/scripts/perf-sweep
        run: |
          "$YA_PERF_SWEEP" 'ya-perf-suite-' --kill --kill-group

  markdown-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @yep-anywhere/server benchmark:markdown

  windows-host-awake-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @yep-anywhere/shared build
      # A hosted runner can rarely spend the full production startup bound in
      # cold PowerShell/Add-Type setup. One isolated-test retry distinguishes
      # that host jitter without extending YA's bounded 20-second probe.
      - run: >-
          pnpm --filter @yep-anywhere/server exec vitest run
          test/services/WindowsHostAwakeBackend.test.ts --retry=1

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.12
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm -F @yep-anywhere/client exec playwright install chromium
      - run: pnpm test:e2e
